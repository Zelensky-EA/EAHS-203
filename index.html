<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Everett Alvarez Science Department Inventory</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #19324b; background: #f4f7fa; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { margin: 24px; padding: 32px; max-width: 540px; background: white; border: 1px solid #dbe5ee; border-radius: 14px; }
    h1 { font-size: 25px; line-height: 1.3; margin-top: 0; }
    p { line-height: 1.6; }
    a { display: inline-block; background: #123257; color: white; text-decoration: none; padding: 12px 18px; border-radius: 8px; }
    a:focus-visible { outline: 3px solid #d9ab48; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Everett Alvarez Science Department Inventory</h1>
    <p>Opening the shared department inventory. Sign in with your school Google account if prompted.</p>
    <a id="inventory" href="https://script.google.com/a/macros/salinasuhsd.org/s/AKfycbx5wsf3Np-WKwCRUWLL2tjTP1Y7YpOdoJlv4B_3R0U5Tkx_tnaj5Xeo3XthRXNyXy8rSw/exec">Open shared inventory</a>
  </main>
  <script>
    window.location.replace(document.getElementById('inventory').href);
  </script>
</body>
</html>
