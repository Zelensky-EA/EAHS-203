function demoCall(method,p){let s=JSON.parse(localStorage.getItem('science_inventory_demo_v2')||'null')||seed(),item=s.items.find(x=>x.id===p?.itemId);delete s._message;const log=(action,x,quantity,actor,details)=>s.activity.unshift({id:uid(),timestamp:new Date().toISOString(),action,itemId:x.id,itemName:x.name,quantity,actor,details});let result=s;
 if(method==='saveItem'){const old=s.items.find(x=>x.id===p.id),x={...p,id:old?.id||uid(),checkedOut:old?.checkedOut||0,needsRepair:old?.needsRepair||0,needsReplacement:old?.needsReplacement||0,quantity:n(p.quantity),minStock:n(p.minStock),updatedAt:new Date().toISOString()};if(!x.name||!s.locations.includes(x.location))throw Error('Name and a listed location are required.');x.name=canonicalName(x.name,x.kind,x.unit||'each',s.items);if(x.quantity<x.checkedOut+x.needsRepair+x.needsReplacement)throw Error('Quantity is below checked out or flagged amount.');let match=!old&&s.items.find(y=>nameSignature(y.name)===nameSignature(x.name)&&y.location===x.location&&y.kind===x.kind);if(match){if(match.unit.toLowerCase()!==x.unit.toLowerCase()||(x.sku&&match.sku&&x.sku.toLowerCase()!==match.sku.toLowerCase()))throw Error('Matching item has a different SKU or counting unit. Use Add stock on the correct entry.');if(!Number.isSafeInteger(x.quantity)||x.quantity<1)throw Error('Additional quantity must be a positive whole number.');if(!match.sku)match.sku=nextDemoSku(s.items);match.quantity=n(match.quantity)+x.quantity;log('RESTOCK',match,x.quantity,p.actor||'','New total '+match.quantity);s._message=`Added ${x.quantity} ${match.unit} to ${match.name} in ${match.location}. New total: ${match.quantity}.`;}else{if(x.sku&&s.items.some(y=>y.id!==x.id&&y.location===x.location&&y.sku?.toLowerCase()===x.sku.toLowerCase()))throw Error('This SKU is already used in this room.');if(!x.sku)x.sku=old?.sku||nextDemoSku(s.items);if(old)Object.assign(old,x);else s.items.push(x);log(old?'EDIT':'ADD',x,x.quantity,p.actor||'','Item details');}}
 if(method==='importItems'){let added=0,skipped=0,restocked=0;if(p.addToExisting&&!p.actor)throw Error('Enter staff member for deliveries.');for(const r of p.rows){if(!r.name||!s.locations.includes(r.location)||!['Reusable','Consumable'].includes(r.kind)||r.quantity===''||!Number.isInteger(Number(r.quantity))||Number(r.quantity)<0)throw Error('Each row needs a name, listed location, type, and valid quantity.');r.name=canonicalName(r.name,r.kind,r.unit||'each',s.items);let match=s.items.find(x=>x.location===r.location&&((r.sku&&x.sku?.toLowerCase()===r.sku.toLowerCase())||(nameSignature(x.name)===nameSignature(r.name)&&x.kind===r.kind)));if(match){if(!p.addToExisting){skipped++;continue}if(match.kind!==r.kind||match.unit!==(r.unit||'each')||r.quantity==='0')throw Error('Delivery has a mismatched type, unit, or zero quantity.');if(!match.sku)match.sku=nextDemoSku(s.items);match.quantity+=n(r.quantity);log('RESTOCK',match,n(r.quantity),p.actor,'CSV stock receipt; new total '+match.quantity);restocked++;continue}let x={...r,id:uid(),quantity:n(r.quantity),checkedOut:0,needsRepair:0,needsReplacement:0,minStock:n(r.minStock)};if(!x.sku)x.sku=nextDemoSku(s.items);s.items.push(x);log('IMPORT',x,x.quantity,p.actor,'CSV import');added++}result={added,restocked,skipped,skippedRows:[],data:s};}
 if(method==='checkout'){let q=n(p.quantity);if(!item||!Number.isInteger(q)||q<1||q>avail(item))throw Error('Quantity exceeds available stock.');if(!p.borrower||!p.destination)throw Error('Staff member and destination required.');if(item.kind==='Reusable'){item.checkedOut=n(item.checkedOut)+q;s.loans.push({id:uid(),itemId:item.id,quantity:q,remaining:q,borrower:p.borrower,destination:p.destination,checkedOutAt:new Date().toISOString(),dueDate:p.dueDate,status:'Open'});log('CHECK OUT',item,q,p.borrower,'To '+p.destination)}else{item.quantity=n(item.quantity)-q;log('USE',item,q,p.borrower,'Used in '+p.destination)}}
 if(method==='returnLoan'){let l=s.loans.find(x=>x.id===p.loanId),q=n(p.quantity);if(!l||q<1||q>l.remaining)throw Error('Invalid return quantity.');item=s.items.find(x=>x.id===l.itemId);l.remaining-=q;item.checkedOut-=q;if(!l.remaining)s.loans=s.loans.filter(x=>x.id!==l.id);log('RETURN',item,q,p.actor||l.borrower,'From '+l.destination)}
 if(method==='adjustStock'){let q=n(p.quantity);if(!item||!Number.isInteger(q)||q<n(item.checkedOut)+n(item.needsRepair)+n(item.needsReplacement))throw Error('Count must cover checked out and flagged items.');let prior=item.quantity;item.quantity=q;log('COUNT',item,q-prior,p.actor||'',p.reason||'Count corrected')}
 if(method==='receiveStock'){let q=n(p.quantity);if(!item||!Number.isSafeInteger(q)||q<1||!p.actor)throw Error('Enter a positive whole quantity and the staff member.');item.quantity=n(item.quantity)+q;log('RESTOCK',item,q,p.actor,'New total '+item.quantity);s._message=`Added ${q} ${item.unit} to ${item.name} in ${item.location}. New total: ${item.quantity}.`}
 if(method==='reportIssue'){let q=n(p.quantity);if(!item||!['Repair','Replacement'].includes(p.type)||q<1||q>avail(item))throw Error('Affected quantity exceeds available units.');if(!p.reportedBy||!p.details)throw Error('Staff member and description required.');let k=p.type==='Repair'?'needsRepair':'needsReplacement';item[k]=n(item[k])+q;s.issues.push({id:uid(),itemId:item.id,type:p.type,quantity:q,remaining:q,reportedBy:p.reportedBy,details:p.details,reportedAt:new Date().toISOString(),status:'Open'});log(p.type.toUpperCase()+' NEEDED',item,q,p.reportedBy,p.details)}
 if(method==='resolveIssue'){let issue=s.issues.find(x=>x.id===p.issueId),q=n(p.quantity);if(!issue||q<1||q>issue.remaining||!p.resolvedBy)throw Error('Invalid resolution.');item=s.items.find(x=>x.id===issue.itemId);let k=issue.type==='Repair'?'needsRepair':'needsReplacement';item[k]-=q;if(p.resolution==='Removed from inventory')item.quantity-=q;else if(p.resolution!=='Back in service')throw Error('Choose a resolution.');issue.remaining-=q;if(!issue.remaining)s.issues=s.issues.filter(x=>x.id!==issue.id);log('ISSUE RESOLVED',item,q,p.resolvedBy,p.resolution)}
 localStorage.setItem('science_inventory_demo_v2',JSON.stringify(s));return result;}
function call(method,p){return demo?Promise.resolve().then(()=>demoCall(method,p)):new Promise((resolve,reject)=>{let runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e.message||String(e))));if(method==='getData')runner.getData();else if(method==='saveItem')runner.saveItem(p);else if(method==='importItems')runner.importItems(p.rows,p.actor,p.addToExisting);else if(method==='receiveStock')runner.receiveStock(p);else if(method==='checkout')runner.checkout(p);else if(method==='returnLoan')runner.returnLoan(p);else if(method==='adjustStock')runner.adjustStock(p);else if(method==='reportIssue')runner.reportIssue(p);else if(method==='resolveIssue')runner.resolveIssue(p);});}
function flash(message,error=false){$('#notice').innerHTML='<div class="notice '+(error?'error':'')+'">'+h(message)+'</div>';setTimeout(()=>{if($('#notice'))$('#notice').innerHTML=''},8000)}
function title(t,s,action=''){return `<div class="title"><div><h1>${t}</h1><p class="muted">${s}</p></div>${action}</div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td class="empty" colspan="${headers.length}">Nothing to show yet.</td></tr>`}</tbody></table></div>`}
function nav(){ $('#tabs').innerHTML=TABS.map(([id,label])=>`<button class="tab ${tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('');$('#mode').textContent=demo?'LOCAL DEMO · sample data in this browser':'SHARED GOOGLE SHEET';}
function render(){nav();$('#view').innerHTML=({dashboard:overview,department:departmentView,inventory:inventoryView,catalog:catalogView,import:importView,checkout:checkoutView,loans:loansView,issues:issuesView,activity:activityView})[tab]();}
function groups(){let found=new Map();for(const item of state.items){let key=[nameSignature(item.name),item.kind,String(item.unit||'each').toLowerCase()].join('|');if(!found.has(key))found.set(key,{name:item.name,kind:item.kind,unit:item.unit||'each',category:item.category,items:[]});found.get(key).items.push(item)}return [...found.values()].sort((a,b)=>a.name.localeCompare(b.name))}
function departmentView(){const list=groups().filter(g=>!query||[g.name,g.category,...g.items.map(x=>x.location)].some(v=>String(v||'').toLowerCase().includes(query.toLowerCase())));return title('Whole department totals',`${list.length} distinct item types across ${state.items.length} room-level entries.`,`<button class="btn" onclick="openItem()">+ Add stock or item</button>`)+`<section class="panel"><div class="toolbar"><input id="search" placeholder="Find a material, size, or room…" value="${h(query)}"></div>${table(['Item / size','Total owned','Available','Out / flagged','Room breakdown'],list.map(g=>{let owned=g.items.reduce((sum,x)=>sum+n(x.quantity),0),available=g.items.reduce((sum,x)=>sum+avail(x),0),out=g.items.reduce((sum,x)=>sum+n(x.checkedOut),0),repair=g.items.reduce((sum,x)=>sum+n(x.needsRepair),0),replace=g.items.reduce((sum,x)=>sum+n(x.needsReplacement),0);return `<tr><td><span class="itemname">${h(g.name)}</span><div class="detail">${h(g.kind)} · ${h(g.category)}</div></td><td><b>${owned} ${h(g.unit)}</b></td><td>${available} ${h(g.unit)}</td><td>${out} out · ${repair} repair · ${replace} replace</td><td>${g.items.map(x=>`<div>${h(x.location)}: <b>${n(x.quantity)}</b> total, ${avail(x)} available <button class="btn small secondary" onclick="openReceive('${x.id}')">+ Stock</button></div>`).join('')}</td></tr>`}).join(''))}</section><p class="muted">Totals update after additions, checkouts, uses, returns, counts, and condition changes. Items group by exact name, type, and counting unit; use consistent catalog names for reliable department totals.</p>`}
function overview(){const low=state.items.filter(x=>n(x.minStock)>0&&avail(x)<=n(x.minStock)),expired=state.items.filter(x=>x.expiration&&x.expiration<today()),due=state.loans.filter(x=>x.dueDate&&x.dueDate<today());return title('Department overview','Confirmed items, current locations, and work needing attention.')+`<div class="cards"><div class="card"><small>Inventory entries</small><strong>${state.items.length}</strong><span class="sub">Confirmed item records</span></div><div class="card"><small>Open checkouts</small><strong>${state.loans.length}</strong><span class="sub">${due.length} overdue</span></div><div class="card"><small>Repair / replacement</small><strong>${state.issues.length}</strong><span class="sub">${state.issues.filter(x=>x.type==='Repair').length} repair · ${state.issues.filter(x=>x.type==='Replacement').length} replace</span></div><div class="card"><small>At or below reorder level</small><strong>${low.length}</strong><span class="sub">Entries with a set reorder level</span></div></div><div class="grid2"><section class="panel"><h2>Needs attention</h2>${low.length||expired.length||due.length||state.issues.length?`<div class="tablewrap">${[...state.issues.map(x=>`<div class="box" style="margin-bottom:8px"><b>${h(x.type)}:</b> ${h(state.items.find(i=>i.id===x.itemId)?.name||'Unknown')} · ${n(x.remaining)} unit(s)<div class="detail">${h(x.details)}</div></div>`),...low.map(x=>`<div class="box" style="margin-bottom:8px"><b>${h(x.name)}</b> · ${h(x.location)}<div class="detail">Available ${avail(x)} ${h(x.unit||'each')} · reorder at ${n(x.minStock)}</div></div>`),...expired.map(x=>`<div class="box" style="margin-bottom:8px"><b>${h(x.name)}</b> · expiration ${h(x.expiration)}</div>`),...due.map(x=>`<div class="box" style="margin-bottom:8px"><b>Overdue:</b> ${h(state.items.find(i=>i.id===x.itemId)?.name||'Unknown item')} · ${h(x.borrower)}</div>`)].slice(0,8).join('')}</div>`:'<p class="muted">No open requests, low stock, expired entries, or overdue loans.</p>'}</section><section class="panel"><h2>By home location</h2>${table(['Classroom / prep area','Item entries','Open requests'],locations().map(loc=>`<tr><td class="itemname">${h(loc)}</td><td>${state.items.filter(x=>x.location===loc).length}</td><td>${state.issues.filter(q=>state.items.find(x=>x.id===q.itemId)?.location===loc).length}</td></tr>`).join(''))}</section></div>`}
function locations(){return state.locations||ROOMS}
function inventoryView(){let items=state.items.filter(x=>(!query||[x.name,x.sku,x.category,x.location,x.storage,x.notes].some(v=>String(v||'').toLowerCase().includes(query.toLowerCase())))&&(!filterLoc||x.location===filterLoc)&&(!filterCat||x.category===filterCat));return title('By room',`${items.length} of ${state.items.length} confirmed entries · home room is required.`,`<button class="btn" onclick="openItem()">+ Add item</button>`)+`<section class="panel"><div class="toolbar"><input id="search" placeholder="Search item, SKU, room, shelf…" value="${h(query)}"><select id="locfilter"><option value="">All locations</option>${locations().map(x=>`<option ${filterLoc===x?'selected':''}>${h(x)}</option>`).join('')}</select><select id="catfilter"><option value="">All categories</option>${[...new Set([...CATEGORIES,...state.catalog.map(x=>x.category)])].map(x=>`<option ${filterCat===x?'selected':''}>${h(x)}</option>`).join('')}</select><button class="btn secondary" onclick="exportCsv()">Export CSV</button></div>${table(['Item','Category','Home location','Type','Available / total','Attention','Actions'],items.map(i=>`<tr><td><span class="itemname">${h(i.name)}</span><div class="detail">${h(i.sku||'No SKU')} ${i.storage?'· '+h(i.storage):''}</div></td><td>${h(i.category)}</td><td>${h(i.location)}</td><td>${h(i.kind)}</td><td>${avail(i)} / ${n(i.quantity)} ${h(i.unit||'each')}</td><td>${n(i.needsRepair)?`<span class="pill warn">${n(i.needsRepair)} repair</span> `:''}${n(i.needsReplacement)?`<span class="pill red">${n(i.needsReplacement)} replace</span> `:''}${n(i.minStock)>0&&avail(i)<=n(i.minStock)?'<span class="pill warn">Low stock</span>':''}</td><td><div class="row"><button class="btn small secondary" onclick="openReceive('${i.id}')">+ Stock</button><button class="btn small secondary" onclick="openItem('${i.id}')">Edit</button><button class="btn small secondary" onclick="openCount('${i.id}')">Count</button><button class="btn small secondary" onclick="openIssue('${i.id}')">Flag</button></div></td></tr>`).join(''))}</section>`}
function catalogView(){let list=state.catalog.filter(x=>!catalogQuery||[x.name,x.category,x.courses].some(v=>String(v||'').toLowerCase().includes(catalogQuery.toLowerCase())));return title('Equipment catalog',`${list.length} suggested names and sizes · catalog entries are not confirmed stock.`)+`<div class="panel"><div class="toolbar"><input id="catalogSearch" placeholder="Search beaker, buret, microscope, size…" value="${h(catalogQuery)}"></div>${table(['Suggested item','Category','Type','Courses','Action'],list.slice(0,150).map(x=>`<tr><td><span class="itemname">${h(x.name)}</span>${x.notes?`<div class="detail">${h(x.notes)}</div>`:''}</td><td>${h(x.category)}</td><td>${h(x.kind)}</td><td>${h(x.courses)}</td><td><button class="btn small secondary" data-catalog="${state.catalog.indexOf(x)}">Add this item</button></td></tr>`).join(''))}${list.length>150?'<p class="muted">Showing the first 150 results. Narrow your search to find more sizes.</p>':''}</div>`}
function importView(){return title('Add & import','Enter confirmed items individually or bring in an existing inventory CSV.')+`<div class="grid2"><section class="panel"><h2>Add one item or receive stock</h2><p class="muted">Choose a name in Equipment catalog or enter a custom item. A match in the same room adds to its total. For a known entry, use “+ Stock” on the By room page.</p><button class="btn" onclick="openItem()">+ Add item or stock</button></section><section class="panel"><h2>Import a CSV file</h2><ol class="steps"><li><button class="btn small secondary" onclick="downloadTemplate()">Download CSV template</button></li><li>Fill in actual quantity and one of the 11 listed home locations.</li><li>Select the completed file and review it before importing.</li></ol></section></div><section class="panel"><h2>Choose CSV</h2><p class="muted">Up to 500 rows per import. Standard imports skip matching items, so a file can be retried safely. Choose “new deliveries” below only when the file contains additional stock to add to existing totals. The catalog alone does not add inventory.</p><input id="csvfile" type="file" accept=".csv,text/csv"><div id="preview" style="margin-top:15px"></div></section>`}
function checkoutView(){return title('Check out / use','Reusable equipment becomes an open checkout. Consumables are deducted when used.')+`<div class="grid2"><section class="panel"><h2>Record a checkout or use</h2><form id="checkoutForm"><div class="formgrid"><label class="full">Item<select name="itemId" id="checkoutItem" required><option value="">Select an item</option>${state.items.filter(x=>avail(x)>0).sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option value="${h(x.id)}">${h(x.name)} — ${avail(x)} ${h(x.unit)} available · ${h(x.location)}</option>`).join('')}</select></label><label>Quantity<input name="quantity" type="number" min="1" step="1" required></label><label>Staff member<input name="borrower" required placeholder="Your name"></label><label>Using in / destination<select name="destination" required><option value="">Choose location</option>${opts(locations(),'')}</select></label><label>Due date (equipment only)<input name="dueDate" type="date"></label><label class="full">Notes<textarea name="notes" rows="2" placeholder="Class, lab, or purpose (optional)"></textarea></label></div><div class="formactions"><button class="btn" type="submit">Record transaction</button></div></form></section><section class="panel"><h2>How quantities work</h2><div class="box"><b>Reusable</b><p>Checkout lowers the available count while keeping the department total. Return some or all units from the Returns page.</p></div><div class="box" style="margin-top:10px"><b>Consumable</b><p>Use reduces the quantity on hand immediately and records the staff member and destination in Activity.</p></div><p class="muted" id="selectionHelp"></p></section></div>`}
function loansView(){let loans=state.loans;return title('Returns',`${loans.length} open checkouts · partial returns supported.`)+`<section class="panel">${table(['Item','Staff member','Current destination','Remaining','Checked out','Due','Action'],loans.map(l=>{let x=state.items.find(i=>i.id===l.itemId);return `<tr><td class="itemname">${h(x?.name||'Unknown')}</td><td>${h(l.borrower)}</td><td>${h(l.destination)}</td><td>${n(l.remaining)} ${h(x?.unit||'each')}</td><td>${h(String(l.checkedOutAt||'').slice(0,10))}</td><td>${l.dueDate?h(l.dueDate):'—'}</td><td><button class="btn small secondary" onclick="openReturn('${l.id}')">Return</button></td></tr>`}).join(''))}</section>`}
function issuesView(){return title('Repair & replacement',`${state.issues.length} open requests · affected units are unavailable for checkout.`,`<button class="btn" onclick="openIssue()">+ Flag an item</button>`)+`<section class="panel">${table(['Item / home','Request','Affected','Reported by','Problem','Action'],state.issues.map(q=>{let x=state.items.find(i=>i.id===q.itemId);return `<tr><td><span class="itemname">${h(x?.name||'Unknown')}</span><div class="detail">${h(x?.location)}</div></td><td><span class="pill ${q.type==='Replacement'?'red':'warn'}">${h(q.type)}</span></td><td>${n(q.remaining)} ${h(x?.unit||'each')}</td><td>${h(q.reportedBy)}</td><td>${h(q.details)}</td><td><button class="btn small secondary" onclick="openResolve('${q.id}')">Resolve</button></td></tr>`}).join(''))}</section><div class="warningbox">A flagged unit stays in the physical total but cannot be checked out. Resolve as “Back in service” after repair or replacement; choose “Removed from inventory” when discarded without replacement.</div>`}
function activityView(){return title('Activity','Recent changes, counts, checkouts, uses, and returns. The Google Sheet holds the full log.')+`<section class="panel">${table(['Date','Action','Item','Quantity','Staff member','Details'],state.activity.map(a=>`<tr><td>${h(String(a.timestamp||'').slice(0,16).replace('T',' '))}</td><td><span class="pill">${h(a.action)}</span></td><td class="itemname">${h(a.itemName)}</td><td>${h(a.quantity)}</td><td>${h(a.actor)}</td><td>${h(a.details)}</td></tr>`).join(''))}</section>`}
function modal(name,body){$('#modal').innerHTML=`<div class="modalhead"><h2>${name}</h2><button class="close" aria-label="Close" onclick="$('#modal').close()">×</button></div><div class="modalbody">${body}</div>`;$('#modal').showModal()}
function opts(arr,val){return arr.map(x=>`<option value="${h(x)}" ${x===val?'selected':''}>${h(x)}</option>`).join('')}
function field(label,key,v,type='text',extra=''){return `<label>${label}<input name="${key}" type="${type}" value="${h(v||'')}" ${extra}></label>`}
function openItem(id,preset){let i=state.items.find(x=>x.id===id)||preset||{};modal(id?'Edit item':'Add confirmed item',`<form id="itemForm">${id?'<div class="warningbox" style="margin-bottom:14px">Use “+ Stock” to receive more units or “Count” to correct a physical count.</div>':'<div class="warningbox" style="margin-bottom:14px">If this name, type, and home location already exist, the quantity below is added to the existing total. Otherwise a new entry is created.</div>'}<div class="formgrid">${field('Item name *','name',i.name,'text','required maxlength="160"')}${field('SKU (blank = automatic EAHS number)','sku',i.sku,'text','maxlength="80"')}<label>Category<select name="category">${opts(CATEGORIES,i.category||'Other')}</select></label><label>Type *<select name="kind">${opts(['Reusable','Consumable'],i.kind||'Reusable')}</select></label>${field(id?'Current total (use Stock / Count to change)':'Quantity at this location *','quantity',i.quantity??0,'number',id?'required readonly':'required min="0" step="1"')}${field('Unit','unit',i.unit||'each')}<label>Home classroom / prep area *<select name="location" required><option value="">Choose location</option>${opts(locations(),i.location)}</select></label>${field('Shelf / cabinet / storage','storage',i.storage)}${field('Reorder level','minStock',i.minStock??0,'number','min="0" step="1"')}${field('Manufacturer','manufacturer',i.manufacturer)}${field('Catalog number','catalogNumber',i.catalogNumber)}${field('Hazard / SDS note','hazard',i.hazard)}${field('Expiration date','expiration',i.expiration,'date')}${field('Staff member (for audit)','actor','')}<label class="full">Notes<textarea name="notes" rows="3" maxlength="500">${h(i.notes)}</textarea></label></div><div class="formactions"><button type="button" class="btn secondary" onclick="$('#modal').close()">Cancel</button><button class="btn" type="submit">Save item</button></div></form>`);$('#itemForm').onsubmit=e=>submit(e,'saveItem',{...Object.fromEntries(new FormData(e.target)),id:id||''},'Item saved.');}
function openReceive(id){const i=state.items.find(x=>x.id===id);modal('Add stock',`<p><b>${h(i.name)}</b> · ${h(i.location)} · current total <b>${n(i.quantity)} ${h(i.unit)}</b>.</p><form id="receiveForm">${field('Additional quantity received','quantity',1,'number','required min="1" step="1"')}${field('Received by','actor','','text','required')}<label>Notes<input name="notes" placeholder="Shipment, donation, or transfer (optional)"></label><div class="formactions"><button class="btn" type="submit">Add to total</button></div></form>`);$('#receiveForm').onsubmit=e=>submit(e,'receiveStock',{...Object.fromEntries(new FormData(e.target)),itemId:id},'Stock added.');}
function openCount(id){const i=state.items.find(x=>x.id===id),minimum=n(i.checkedOut)+n(i.needsRepair)+n(i.needsReplacement);modal('Correct physical count',`<p><b>${h(i.name)}</b> · ${h(i.location)}. Total: ${n(i.quantity)}; checked out: ${n(i.checkedOut)}; flagged: ${n(i.needsRepair)+n(i.needsReplacement)}.</p><form id="countForm">${field('New total quantity','quantity',i.quantity,'number',`required min="${minimum}" step="1"`)}${field('Staff member','actor','')}<label>Reason<input name="reason" placeholder="Stocktake, new shipment, missing item…"></label><div class="formactions"><button class="btn" type="submit">Save count</button></div></form>`);$('#countForm').onsubmit=e=>submit(e,'adjustStock',{...Object.fromEntries(new FormData(e.target)),itemId:id},'Count updated.');}
function openIssue(id){const item=state.items.find(x=>x.id===id);modal('Flag repair or replacement',`<form id="issueForm"><div class="formgrid"><label class="full">Item<select name="itemId" required><option value="">Select item</option>${state.items.filter(x=>avail(x)>0).map(x=>`<option value="${h(x.id)}" ${id===x.id?'selected':''}>${h(x.name)} — ${h(x.location)} (${avail(x)} available)</option>`).join('')}</select></label><label>Request<select name="type">${opts(['Repair','Replacement'],'Repair')}</select></label>${field('Number of affected units','quantity',1,'number','required min="1" step="1"')}${field('Reported by','reportedBy','','text','required')}<label class="full">Describe what is wrong *<textarea name="details" rows="3" required maxlength="500" placeholder="Include identifying details, missing parts, or why replacement is needed"></textarea></label></div><div class="formactions"><button class="btn" type="submit">Flag units</button></div></form>`);$('#issueForm').onsubmit=e=>submit(e,'reportIssue',Object.fromEntries(new FormData(e.target)),'Request recorded. Affected units are unavailable.');}
function openResolve(id){const q=state.issues.find(x=>x.id===id),i=state.items.find(x=>x.id===q.itemId);modal('Resolve request',`<p><b>${h(i?.name)}</b> · ${h(q.type)}: ${h(q.details)}</p><form id="resolveForm"><div class="formgrid">${field('Number resolved','quantity',q.remaining,'number',`required min="1" max="${n(q.remaining)}" step="1"`)}<label>Outcome<select name="resolution">${opts(['Back in service','Removed from inventory'],'Back in service')}</select></label>${field('Resolved by','resolvedBy','','text','required')}<label>Notes<input name="notes" placeholder="Repair performed or replacement received"></label></div><div class="formactions"><button class="btn" type="submit">Save resolution</button></div></form>`);$('#resolveForm').onsubmit=e=>submit(e,'resolveIssue',{...Object.fromEntries(new FormData(e.target)),issueId:id},'Request updated.');}
function openReturn(id){const l=state.loans.find(x=>x.id===id),i=state.items.find(x=>x.id===l.itemId);modal('Return equipment',`<p><b>${h(i?.name)}</b> · checked out to ${h(l.borrower)} in ${h(l.destination)}. Remaining: ${n(l.remaining)} ${h(i?.unit)}.</p><form id="returnForm">${field('Quantity to return','quantity',l.remaining,'number',`required min="1" max="${n(l.remaining)}" step="1"`)}${field('Received by','actor','')}<label>Notes<input name="notes" placeholder="Condition, missing parts…"></label><div class="formactions"><button class="btn" type="submit">Record return</button></div></form>`);$('#returnForm').onsubmit=e=>submit(e,'returnLoan',{...Object.fromEntries(new FormData(e.target)),loanId:id},'Return recorded.');}
async function submit(e,method,p,message){e.preventDefault();let btn=e.target.querySelector('button[type=submit]');btn.disabled=true;try{const result=await call(method,p);state=result;$('#modal').close();render();flash(result._message||message)}catch(err){flash(err.message,true)}finally{btn.disabled=false}}
function csv(rows){return rows.map(r=>r.map(x=>{let s=String(x??'');if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return `"${s.replace(/"/g,'""')}"`}).join(',')).join('\r\n')+'\r\n'}
function download(filename,contents){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([contents],{type:'text/csv;charset=utf-8'}));a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function downloadTemplate(){download('science_inventory_template.csv',csv([HEADERS,['EQ-001','Compound light microscope','Biology equipment','Reusable','24','each','409','Cabinet B','5','','','','','Student microscopes']]))}
function exportCsv(){download('science_inventory_export_'+today()+'.csv',csv([EXPORT_HEADERS,...state.items.map(i=>EXPORT_HEADERS.map(k=>i[k]??''))]));}
function parseCsv(text){let rows=[],row=[],value='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){value+='"';i++}else if(c==='"')quoted=false;else value+=c}else if(c==='"')quoted=true;else if(c===','){row.push(value);value=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(value);if(row.some(x=>x.trim()))rows.push(row);row=[];value=''}else value+=c}if(quoted)throw Error('CSV has an unclosed quotation mark.');row.push(value);if(row.some(x=>x.trim()))rows.push(row);return rows}
function showPreview(){
 let known=[...state.items], invalid=[];
 let preview=draftRows.map((row,index)=>{
   try {let stored=canonicalName(row.name,row.kind,row.unit||'each',known);known.push({name:stored,kind:row.kind,unit:row.unit||'each'});return {...row,stored,changed:stored!==row.name};}
   catch(error){invalid.push(`Row ${index+2}: ${error.message}`);return {...row,stored:'Choose a more specific catalog name',changed:false};}
 });
 let p=$('#preview');
 p.innerHTML=`<div class="warningbox">${draftRows.length} rows ready. Names are matched regardless of word order, capitalization, or spacing around mL. Different sizes remain separate.</div>${invalid.length?`<div class="notice error" style="margin-top:12px">${h(invalid.slice(0,3).join(' · '))}${invalid.length>3?' · and '+(invalid.length-3)+' more':''}<br>Correct these names in the CSV and select it again.</div>`:''}${table(['CSV item name','Will be stored as','Quantity','Home location'],preview.slice(0,10).map(x=>`<tr><td>${h(x.name)}</td><td class="itemname">${h(x.stored)}</td><td>${h(x.quantity)} ${h(x.unit||'each')}</td><td>${h(x.location)}</td></tr>`).join(''))}<label style="margin-top:16px"><input id="addToExisting" type="checkbox" style="width:auto;margin-right:8px">This CSV lists NEW DELIVERIES — add matching quantities to existing totals</label><p class="detail">Leave unchecked for an initial inventory or retry. Checking it will add stock again if you import the same delivery twice.</p><div class="row" style="margin-top:14px"><input id="importActor" placeholder="Your name (required for deliveries)" style="max-width:270px"><button class="btn" id="doImport" ${invalid.length?'disabled':''}>Import ${draftRows.length} rows</button></div>`;
 $('#doImport').onclick=async e=>{e.target.disabled=true;try{let addToExisting=$('#addToExisting').checked;let r=await call('importItems',{rows:draftRows,actor:$('#importActor').value,addToExisting});state=r.data;draftRows=[];render();flash(`${r.added} new entries; ${r.restocked||0} existing entries restocked; ${r.skipped} duplicates skipped.`)}catch(err){flash(err.message,true);e.target.disabled=false}};
}
document.addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render();return}let c=e.target.closest('[data-catalog]');if(c){openItem('',state.catalog[Number(c.dataset.catalog)])}});
document.addEventListener('input',e=>{if(e.target.id==='search'||e.target.id==='catalogSearch'){let key=e.target.id==='search'?'query':'catalogQuery';if(key==='query')query=e.target.value;else catalogQuery=e.target.value;let pos=e.target.selectionStart,id=e.target.id;render();$('#'+id).focus();$('#'+id).setSelectionRange(pos,pos)}});
document.addEventListener('change',async e=>{if(e.target.id==='locfilter'){filterLoc=e.target.value;render()}if(e.target.id==='catfilter'){filterCat=e.target.value;render()}if(e.target.id==='checkoutItem'){let i=state.items.find(x=>x.id===e.target.value);$('#selectionHelp').textContent=i?`${i.kind}: ${avail(i)} ${i.unit||'each'} available at ${i.location}.`:''}if(e.target.id==='csvfile'&&e.target.files[0]){try{let rows=parseCsv((await e.target.files[0].text()).replace(/^\uFEFF/,''));let header=rows.shift().map(x=>x.trim());let missing=['name','kind','quantity','location'].filter(x=>!header.includes(x));if(missing.length)throw Error('Missing CSV columns: '+missing.join(', '));if(rows.length>500)throw Error('Import up to 500 rows at a time.');if(!rows.length)throw Error('No data rows found.');draftRows=rows.map(r=>Object.fromEntries(HEADERS.map(k=>[k,(r[header.indexOf(k)]||'').trim()])));showPreview()}catch(err){draftRows=[];flash(err.message,true)}finally{e.target.value=''}}});
document.addEventListener('submit',e=>{if(e.target.id==='checkoutForm')submit(e,'checkout',Object.fromEntries(new FormData(e.target)),'Transaction recorded.')});
call('getData').then(r=>{state=r;render()}).catch(e=>{render();flash(e.message,true)});
</script></body></html>
