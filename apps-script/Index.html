 if(method==='receiveStock'){let q=n(p.quantity);if(!item||!Number.isSafeInteger(q)||q<1||!p.actor)throw Error('Enter a positive whole quantity and the staff member.');item.quantity=n(item.quantity)+q;log('RESTOCK',item,q,p.actor,'New total '+item.quantity);s._message=`Added ${q} ${item.unit} to ${item.name} in ${item.location}. New total: ${item.quantity}.`}
 if(method==='reportIssue'){let q=n(p.quantity);if(!item||!['Repair','Replacement'].includes(p.type)||q<1||q>avail(item))throw Error('Affected quantity exceeds available units.');if(!p.reportedBy||!p.details)throw Error('Staff member and description required.');let k=p.type==='Repair'?'needsRepair':'needsReplacement';item[k]=n(item[k])+q;s.issues.push({id:uid(),itemId:item.id,type:p.type,quantity:q,remaining:q,reportedBy:p.reportedBy,details:p.details,reportedAt:new Date().toISOString(),status:'Open'});log(p.type.toUpperCase()+' NEEDED',item,q,p.reportedBy,p.details)}
 if(method==='resolveIssue'){let issue=s.issues.find(x=>x.id===p.issueId),q=n(p.quantity);if(!issue||q<1||q>issue.remaining||!p.resolvedBy)throw Error('Invalid resolution.');item=s.items.find(x=>x.id===issue.itemId);let k=issue.type==='Repair'?'needsRepair':'needsReplacement';item[k]-=q;if(p.resolution==='Removed from inventory')item.quantity-=q;else if(p.resolution!=='Back in service')throw Error('Choose a resolution.');issue.remaining-=q;if(!issue.remaining)s.issues=s.issues.filter(x=>x.id!==issue.id);log('ISSUE RESOLVED',item,q,p.resolvedBy,p.resolution)}

function call(method,p){return demo?Promise.resolve().then(()=>demoCall(method,p)):new Promise((resolve,reject)=>{let runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e.message||String(e))));if(method==='getData')runner.getData();else if(method==='saveItem')runner.saveItem(p);else if(method==='importItems')runner.importItems(p.rows,p.actor,p.addToExisting);else if(method==='receiveStock')runner.receiveStock(p);else if(method==='checkout')runner.checkout(p);else if(method==='returnLoan')runner.returnLoan(p);else if(method==='adjustStock')runner.adjustStock(p);else if(method==='reportIssue')runner.reportIssue(p);else if(method==='resolveIssue')runner.resolveIssue(p);});}

function groups(){let found=new Map();for(const item of state.items){let key=[nameSignature(item.name),item.kind,String(item.unit||'each').toLowerCase()].join('|');if(!found.has(key))found.set(key,{name:item.name,kind:item.kind,unit:item.unit||'each',category:item.category,items:[]});found.get(key).items.push(item)}return [...found.values()].sort((a,b)=>a.name.localeCompare(b.name))}
function departmentView(){const list=groups().filter(g=>!query||[g.name,g.category,...g.items.map(x=>x.location)].some(v=>String(v||'').toLowerCase().includes(query.toLowerCase())));return title('Whole department totals',`${list.length} distinct item types across ${state.items.length} room-level entries.`,`<button class="btn" onclick="openItem()">+ Add stock or item</button>`)+`<section class="panel"><div class="toolbar"><input id="search" placeholder="Find a material, size, or room…" value="${h(query)}"></div>${table(['Item / size','Total owned','Available','Out / flagged','Room breakdown'],list.map(g=>{let owned=g.items.reduce((sum,x)=>sum+n(x.quantity),0),available=g.items.reduce((sum,x)=>sum+avail(x),0),out=g.items.reduce((sum,x)=>sum+n(x.checkedOut),0),repair=g.items.reduce((sum,x)=>sum+n(x.needsRepair),0),replace=g.items.reduce((sum,x)=>sum+n(x.needsReplacement),0);return `<tr><td><span class="itemname">${h(g.name)}</span><div class="detail">${h(g.kind)} · ${h(g.category)}</div></td><td><b>${owned} ${h(g.unit)}</b></td><td>${available} ${h(g.unit)}</td><td>${out} out · ${repair} repair · ${replace} replace</td><td>${g.items.map(x=>`<div>${h(x.location)}: <b>${n(x.quantity)}</b> total, ${avail(x)} available <button class="btn small secondary" onclick="openReceive('${x.id}')">+ Stock</button></div>`).join('')}</td></tr>`}).join(''))}</section><p class="muted">Totals update after additions, checkouts, uses, returns, counts, and condition changes. Items group by exact name, type, and counting unit; use consistent catalog names for reliable department totals.</p>`}
function overview(){const low=state.items.filter(x=>n(x.minStock)>0&&avail(x)<=n(x.minStock)),expired=state.items.filter(x=>x.expiration&&x.expiration<today()),due=state.loans.filter(x=>x.dueDate&&x.dueDate<today());return title('Department overview','Confirmed items, current locations, and work needing attention.')+`<div class="cards"><div class="card"><small>Inventory entries</small><strong>${state.items.length}</strong><span class="sub">Confirmed item records</span></div><div class="card"><small>Open checkouts</small><strong>${state.loans.length}</strong><span class="sub">${due.length} overdue</span></div><div class="card"><small>Repair / replacement</small><strong>${state.issues.length}</strong><span class="sub">${state.issues.filter(x=>x.type==='Repair').length} repair · ${state.issues.filter(x=>x.type==='Replacement').length} replace</span></div><div class="card"><small>At or below reorder level</small><strong>${low.length}</strong><span class="sub">Entries with a set reorder level</span></div></div><div class="grid2"><section class="panel"><h2>Needs attention</h2>${low.length||expired.length||due.length||state.issues.length?`<div class="tablewrap">${[...state.issues.map(x=>`<div class="box" style="margin-bottom:8px"><b>${h(x.type)}:</b> ${h(state.items.find(i=>i.id===x.itemId)?.name||'Unknown')} · ${n(x.remaining)} unit(s)<div class="detail">${h(x.details)}</div></div>`),...low.map(x=>`<div class="box" style="margin-bottom:8px"><b>${h(x.name)}</b> · ${h(x.location)}<div class="detail">Available ${avail(x)} ${h(x.unit||'each')} · reorder at ${n(x.minStock)}</div></div>`),...expired.map(x=>`<div class="box" style="margin-bottom:8px"><b>${h(x.name)}</b> · expiration ${h(x.expiration)}</div>`),...due.map(x=>`<div class="box" style="margin-bottom:8px"><b>Overdue:</b> ${h(state.items.find(i=>i.id===x.itemId)?.name||'Unknown item')} · ${h(x.borrower)}</div>`)].slice(0,8).join('')}</div>`:'<p class="muted">No open requests, low stock, expired entries, or overdue loan function catalogView(){let list=state.catalog.filter(x=>!catalogQuery||[x.name,x.category,x.courses].some(v=>String(v||'').toLowerCase().includes(catalogQuery.toLowerCase())));return title('Equipment catalog',`${list.length} suggested names and sizes · catalog entries are not confirmed stock.`)+`<div class="panel"><div class="toolbar"><input id="catalogSearch" placeholder="Search beaker, buret, microscope, size…" value="${h(catalogQuery)}"></div>${table(['Suggested item','Category','Type','Courses','Action'],list.slice(0,150).map(x=>`<tr><td><span class="itemname">${h(x.name)}</span>${x.notes?`<div class="detail">${h(x.notes)}</div>`:''}</td><td>${h(x.category)}</td><td>${h(x.kind)}</td><td>${h(x.courses)}</td><td><button class="btn small secondary" data-catalog="${state.catalog.indexOf(x)}">Add this item</button></td></tr>`).join(''))}${list.length>150?'<p class="muted">Showing the first 150 results. Narrow your search to find more sizes.</p>':''}</div>`}
function importView(){return title('Add & import','Enter confirmed items individually or bring in an existing inventory CSV.')+`<div class="grid2"><section class="panel"><h2>Add one item or receive stock</h2><p class="muted">Choose a name in Equipment catalog or enter a custom item. A match in the same room adds to its total. For a known entry, use “+ Stock” on the By room page.</p><button class="btn" onclick="openItem()">+ Add item or stock</button></section><section class="panel"><h2>Import a CSV file</h2><ol class="steps"><li><button class="btn small secondary" onclick="downloadTemplate()">Download CSV template</button></li><li>Fill in actual quantity and one of the 11 listed home locations.</li><li>Select the completed file and review it before importing.</li></ol></section></div><section class="panel"><h2>Choose CSV</h2><p class="muted">Up to 500 rows per import. Standard imports skip matching items, so a file can be retried safely. Choose “new deliveries” below only when the file contains additional stock to add to existing totals. The catalog alone does not add inventory.</p><input id="csvfile" type="file" accept=".csv,text/csv"><div id="preview" style="margin-top:15px"></div></section>`}

function openItem(id,preset){let i=state.items.find(x=>x.id===id)||preset||{};modal(id?'Edit item':'Add confirmed item',`<form id="itemForm">${id?'<div class="warningbox" style="margin-bottom:14px">Use “+ Stock” to receive more units or “Count” to correct a physical count.</div>':'<div class="warningbox" style="margin-bottom:14px">Confirm the actual item type and physical count. Names from prior orders do not prove current stock. If this name, type, and home location already exist, the quantity below is added to the existing total.</div>'}<div class="formgrid">${field('Item name *','name',i.name,'text','required maxlength="160"')}${field('SKU (blank = automatic EAHS number)','sku',i.sku,'text','maxlength="80"')}<label>Category<select name="category">${opts(CATEGORIES,CATEGORIES.includes(i.category)?i.category:'Other')}</select></label><label>Type *<select name="kind">${opts(['Reusable','Consumable'],i.kind==='Review'?'Reusable':i.kind||'Reusable')}</select></label>${field(id?'Current total (use Stock / Count to change)':'Quantity at this location *','quantity',i.quantity??0,'number',id?'required readonly':'required min="0" step="1"')}${field('Unit','unit',i.unit||'each')}<label>Home classroom / prep area *<select name="location" required><option value="">Choose location</option>${opts(locations(),i.location)}</select></label>${field('Shelf / cabinet / storage','storage',i.storage)}${field('Reorder level','minStock',i.minStock??0,'number','min="0" step="1"')}${field('Manufacturer','manufacturer',i.manufacturer)}${field('Catalog number','catalogNumber',i.catalogNumber)}${field('Hazard / SDS note','hazard',i.hazard)}${field('Expiration date','expiration',i.expiration,'date')}${field('Staff member (for audit)','actor','')}<label class="full">Notes<textarea name="notes" rows="3" maxlength="500">${h(i.notes)}</textarea></label></div><div class="formactions"><button type="button" class="btn secondary" onclick="$('#modal').close()">Cancel</button><button class="btn" type="submit">Save item</button></div></form>`);$('#itemForm').onsubmit=e=>submit(e,'saveItem',{...Object.fromEntries(new FormData(e.target)),id:id||''},'Item saved.');}

function csv(rows){return rows.map(r=>r.map(x=>{let s=String(x??'');if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return `"${s.replace(/"/g,'""')}"`}).join(',')).join('\r\n')+'\r\n'}
function download(filename,contents){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([contents],{type:'text/csv;charset=utf-8'}));a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function downloadTemplate(){download('science_inventory_template.csv',csv([HEADERS,['EQ-001','Compound light microscope','Biology equipment','Reusable','24','each','409','Cabinet B','5','','','','','Student microscopes']]))}
function exportCsv(){download('science_inventory_export_'+today()+'.csv',csv([EXPORT_HEADERS,...state.items.map(i=>EXPORT_HEADERS.map(k=>i[k]??''))]));}
function parseCsv(text){let rows=[],row=[],value='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){value+='"';i++}else if(c==='"')quoted=false;else value+=c}else if(c==='"')quoted=true;else if(c===','){row.push(value);value=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(value);if(row.some(x=>x.trim()))rows.push(row);row=[];value=''}else value+=c}if(quoted)throw Error('CSV has an unclosed quotation mark.');row.push(value);if(row.some(x=>x.trim()))rows.push(row);return rows}
function showPreview(){
 let known=[...state.items], invalid=[];
 let preview=draftRows.map((row,index)=>{
   try {let stored=canonicalName(row.name,row.kind,row.unit||'each',known);known.push({name:stored,kind:row.kind,unit:row.unit||'each'});return {...row,stored,changed:stored!==row.name};}
   catch(error){invalid.push(`Row ${index+2}: ${error.message}`);return {...row,stored:'Choose a more specific catalog name',changed:false};}
 });
 let p=$('#preview');
 p.innerHTML=`<div class="warningbox">${draftRows.length} rows ready. Names are matched regardless of word order, capitalization, or spacing around mL. Different sizes remain separate.</div>${invalid.length?`<div class="notice error" style="margin-top:12px">${h(invalid.slice(0,3).join(' · '))}${invalid.length>3?' · and '+(invalid.length-3)+' more':''}<br>Correct these names in the CSV and select it again.</div>`:''}${table(['CSV item name','Will be stored as','Quantity','Home location'],preview.slice(0,10).map(x=>`<tr><td>${h(x.name)}</td><td class="itemname">${h(x.stored)}</td><td>${h(x.quantity)} ${h(x.unit||'each')}</td><td>${h(x.location)}</td></tr>`).join(''))}<label style="margin-top:16px"><input id="addToExisting" type="checkbox" style="width:auto;margin-right:8px">This CSV lists NEW DELIVERIES — add matching quantities to existing totals</label><p class="detail">Leave unchecked for an initial inventory or retry. Checking it will add stock again if you import the same delivery twice.</p><div class="row" style="margin-top:14px"><input id="importActor" placeholder="Your name (required for deliveries)" style="max-width:270px"><button class="btn" id="doImport" ${invalid.length?'disabled':''}>Import ${draftRows.length} rows</button></div>`;
 $('#doImport').onclick=async e=>{e.target.disabled=true;try{let addToExisting=$('#addToExisting').checked;let r=await call('importItems',{rows:draftRows,actor:$('#importActor').value,addToExisting});state=r.data;draftRows=[];render();flash(`${r.added} new entries; ${r.restocked||0} existing entries restocked; ${r.skipped} duplicates skipped.`)}catch(err){flash(err.message,true);e.target.disabled=false}};
}
document.addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render();return}let c=e.target.closest('[data-catalog]');if(c){openItem('',state.catalog[Number(c.dataset.catalog)])}});
document.addEventListener('input',e=>{if(e.target.id==='search'||e.target.id==='catalogSearch'){let key=e.target.id==='search'?'query':'catalogQuery';if(key==='query')query=e.target.value;else catalogQuery=e.target.value;let pos=e.target.selectionStart,id=e.target.id;render();$('#'+id).focus();$('#'+id).setSelectionRange(pos,pos)}});
document.addEventListener('change',async e=>{if(e.target.id==='locfilter'){filterLoc=e.target.value;render()}if(e.target.id==='catfilter'){filterCat=e.target.value;render()}if(e.target.id==='checkoutItem'){let i=state.items.find(x=>x.id===e.target.value);$('#selectionHelp').textContent=i?`${i.kind}: ${avail(i)} ${i.unit||'each'} available at ${i.location}.`:''}if(e.target.id==='csvfile'&&e.target.files[0]){try{let rows=parseCsv((await e.target.files[0].text()).replace(/^\uFEFF/,''));let header=rows.shift().map(x=>x.trim());let missing=['name','kind','quantity','location'].filter(x=>!header.includes(x));if(missing.length)throw Error('Missing CSV columns: '+missing.join(', '));if(rows.length>500)throw Error('Import up to 500 rows at a time.');if(!rows.length)throw Error('No data rows found.');draftRows=rows.map(r=>Object.fromEntries(HEADERS.map(k=>[k,(r[header.indexOf(k)]||'').trim()])));showPreview()}catch(err){draftRows=[];flash(err.message,true)}finally{e.target.value=''}}});
document.addEventListener('submit',e=>{if(e.target.id==='checkoutForm')submit(e,'checkout',Object.fromEntries(new FormData(e.target)),'Transaction recorded.')});
call('getData').then(r=>{state=r;render()}).catch(e=>{render();flash(e.message,true)});
</script></body></html>
